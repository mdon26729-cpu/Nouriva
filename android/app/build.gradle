apply plugin: 'com.android.application'

def releaseKeystorePropertiesFile = rootProject.file('keystore.properties')
def releaseKeystoreProperties = new Properties()
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystorePropertiesFile.withInputStream { releaseKeystoreProperties.load(it) }
}

def releaseKeystoreRequiredProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseKeystoreMissingProperties = releaseKeystoreRequiredProperties.findAll {
    !releaseKeystoreProperties.getProperty(it)?.trim()
}
def releaseKeystoreFile = releaseKeystoreProperties.getProperty('storeFile')?.trim()
def releaseKeystoreConfigured = releaseKeystoreMissingProperties.isEmpty() &&
    releaseKeystoreFile &&
    rootProject.file(releaseKeystoreFile).isFile()

android {
    namespace = "com.nouriva.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (releaseKeystoreConfigured) {
            releaseUpload {
                storeFile rootProject.file(releaseKeystoreFile)
                storePassword releaseKeystoreProperties.getProperty('storePassword')
                keyAlias releaseKeystoreProperties.getProperty('keyAlias')
                keyPassword releaseKeystoreProperties.getProperty('keyPassword')
            }
        }
    }
    defaultConfig {
        applicationId "com.nouriva.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (releaseKeystoreConfigured) {
                signingConfig signingConfigs.releaseUpload
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        if (!releaseKeystoreConfigured) {
            def message = 'Release signing is not configured. Create android/keystore.properties with storeFile, storePassword, keyAlias, and keyPassword.'
            if (!releaseKeystoreMissingProperties.isEmpty()) {
                message += " Missing properties: ${releaseKeystoreMissingProperties.join(', ')}."
            } else {
                message += " Keystore file not found: ${releaseKeystoreFile}."
            }
            throw new GradleException(message)
        }
    }
}

tasks.matching { it.name in ['bundleRelease', 'assembleRelease'] }.configureEach {
    dependsOn validateReleaseSigning
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
